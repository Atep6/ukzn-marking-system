name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  e2e:
    if: ${{ secrets.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start dev server in background
        run: nohup node ./scripts/dev-serve.js & sleep 2
      - name: Wait for server
        run: |
          for i in {1..30}; do
            curl -sSf http://127.0.0.1:3000/login && exit 0 || sleep 1
          done
          exit 1
      - name: Run Playwright E2E
        run: npx playwright test --project=chromium --reporter=dot
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUN_E2E: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (optional)
        if: env.RUN_E2E == 'true'
        run: npx playwright install --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Playwright e2e (optional)
        if: env.RUN_E2E == 'true'
        run: npm run test:e2e
